baseURL: 'https://mcf.tclb.io/'
theme:
  - mcf
  - congo
defaultContentLanguage: en
enableRobotsTXT: true
pagination.pagerSize: 15
summaryLength: 0
outputs:
  home:
    - HTML
    - RSS
    - JSON

title: "Modelling Complex Fluids Group"
description: 'The Modelling Complex Fluids (MCF) group at The University of Queensland develops advanced computational methods for multiphase, non-Newtonian and particle-laden flows in the energy and resources sector.'
menus:
  main:
    - name: Research
      pageRef: research
      weight: 10
    - name: People
      pageRef: mcf/people
      weight: 20
    - name: Publications
      pageRef: mcf/publications
      weight: 30
    - name: News
      pageRef: mcf/news
      weight: 40
    - name: Join Us
      pageRef: join
      weight: 50
    - name: Contact
      pageRef: contact
      weight: 60
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  dateFormat: 2 January 2006
  images:
    - img/mcf-social-card.png
  author:
    name: 'Modelling Complex Fluids Group, The University of Queensland'
  recentProp: "Params.mcf"
  recentValue:
    - news
  colorScheme: mcf
  defaultAppearance: light
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true
  header:
    layout: basic
    showTitle: true
  footer:
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true
  homepage:
    layout: custom
    showRecent: true
    recentLimit: 5
  article:
    showDate: true
    showDateUpdated: false
    showAuthor: false
    showBreadcrumbs: true
    showDraftLabel: true
    showEdit: false
    editURL: 'https://github.com/CFD-GO/sites/edit/master/content/'
    editAppendPath: true
    showHeadingAnchors: true
    showPagination: true
    invertPagination: false
    showReadingTime: false
    showTableOfContents: true
    showTaxonomies: false
    showWordCount: false
    showComments: false
  list:
    showBreadcrumbs: true
    showSummary: false
    showTableOfContents: true
    showTaxonomies: false
    groupByYear: false
    paginationWidth: 1
  sitemap:
    excludedKinds:
      - taxonomy
      - term
  taxonomy:
    showTermCount: true
  fathomAnalytics: {}
  verification: {}

  sitesme: mcf
  sites:
    mcf:  https://mcf.tclb.io
    tclb: https://tclb.io
    za: https://za.tclb.io

taxonomies:
  tag: tags
  mcf: mcf
  author: authors
  keyword: keywords
